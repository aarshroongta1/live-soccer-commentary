[project]
name = "commentary"
version = "0.1.0"
description = "Two-voice AI commentary for short recorded soccer clips"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "python-dotenv>=1.0",
    "langgraph>=1,<2",
    "openai>=2,<4",
]

[project.optional-dependencies]
# A small bundled FFmpeg with libass, for reproducible captioned demo renders.
demo = ["imageio-ffmpeg==0.6.0"]
voice = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commentary"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".worktrees", "runs", "clips", ".gstack"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["commentary"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
